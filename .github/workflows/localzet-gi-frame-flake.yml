name: localzet gi_frame flaky test reproduction

on:
  push:
    branches:
      - research/gh-161489-gi-frame-flake
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gi-frame-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: debug-gil
            free_threaded: false
          - mode: debug-free-threaded
            free_threaded: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libffi-dev \
            libsqlite3-dev zlib1g-dev
      - name: Configure
        run: |
          if [ "${{ matrix.free_threaded }}" = true ]; then
            ./configure --with-pydebug --disable-gil --without-ensurepip
          else
            ./configure --with-pydebug --without-ensurepip
          fi
      - name: Build CPython
        run: make -j2
      - name: Repeat the targeted test 80 times
        run: |
          for i in $(seq 1 80); do
            ./python -m unittest \
              test.test_free_threading.test_generators.TestFTGenerators.test_concurrent_gi_frame \
              --quiet
          done
      - name: Test parallel-thread scheduling
        run: |
          ./python -m test -j4 --parallel-threads=4 \
            -m test_concurrent_gi_frame \
            test_free_threading.test_generators
      - name: Run complete generator test module
        run: ./python -m test -j2 test_free_threading.test_generators
