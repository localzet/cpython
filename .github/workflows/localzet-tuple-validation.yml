name: Tuple hashing diagnostics (experimental)

on:
  push:
    branches:
      - gh-161433-tuple-hash-notes
      - gh-161433-dict-set-notes-poc
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuple-hashing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build CPython and run focused regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libffi-dev \
            libsqlite3-dev zlib1g-dev

      - name: Configure debug build
        run: ./configure --with-pydebug --without-ensurepip

      - name: Compile CPython
        run: make -j2

      - name: Run tuple regression tests
        run: ./python -m test -j2 test_tuple test_dict test_set test_traceback
