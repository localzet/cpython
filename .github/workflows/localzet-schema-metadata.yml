name: Schema metadata interchange experiment

on:
  push:
    branches:
      - experimental/schema-metadata-interchange
    paths:
      - 'Tools/experiments/record/schema_metadata/**'
      - '.github/workflows/localzet-schema-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned adapters
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Compile and test schema metadata
        run: |
          cd Tools/experiments/record
          python -m compileall -q schema_metadata
          python -m unittest discover -s schema_metadata -p 'test_*.py' -v
