name: TypedDict dataclass bridge research

on:
  push:
    branches:
      - experimental/typed-dict-dataclass-bridge
    paths:
      - 'Tools/experiments/record/bridge/**'
      - '.github/workflows/localzet-schema-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and check behavior
        run: |
          python -m compileall -q Tools/experiments/record/bridge
          cd Tools/experiments/record
          python -m unittest discover -s bridge -p 'test_*.py' -v
          python -m bridge.example

  typing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned type checkers
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Verify positive and negative typing fixtures
        run: python Tools/experiments/record/bridge/check_typing.py

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned benchmark dependencies
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Measure and record environment
        run: |
          cd Tools/experiments/record
          python -m bridge.benchmark_bridge --sizes 3 10 30 --number 3000 --repeat 5 --output bridge/bridge-results.json
          python -m pip freeze > bridge/bridge-dependencies.txt
          python -c "import json; d=json.load(open('bridge/bridge-results.json')); assert len(d['results']) >= 50"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typed-dict-dataclass-bridge-results
          path: |
            Tools/experiments/record/bridge/bridge-results.json
            Tools/experiments/record/bridge/bridge-dependencies.txt
          if-no-files-found: error
          retention-days: 30
