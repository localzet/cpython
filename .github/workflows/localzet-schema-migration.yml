name: Schema compatibility checker experiment

on:
  push:
    branches:
      - experimental/schema-compatibility-checker
    paths:
      - 'Tools/experiments/record/schema_metadata/**'
      - '.github/workflows/localzet-schema-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned research libraries
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Run complete metadata and migration test suite
        run: |
          cd Tools/experiments/record
          python -m compileall -q schema_metadata
          python -m unittest discover -s schema_metadata -p 'test_*.py' -v

  typing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned research libraries
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Verify public contract and migration implementation
        run: |
          cd Tools/experiments/record
          python schema_metadata/check_typing.py
          python -m mypy --no-incremental --strict \
            schema_metadata/migration.py schema_metadata/cli.py
          pyright schema_metadata/migration.py schema_metadata/cli.py

  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned research libraries
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Produce CI-readable migration reports
        run: |
          cd Tools/experiments/record
          mkdir -p schema_metadata/reports
          python -m schema_metadata.cli \
            schema_metadata.fixtures:ApiV1 \
            schema_metadata.fixtures:ApiV2Breaking \
            --direction input --fail-on never --json \
            > schema_metadata/reports/input-breaking.json
          python -m schema_metadata.cli \
            schema_metadata.fixtures:AliasV1 \
            schema_metadata.fixtures:AliasV2 \
            --direction output --fail-on never --json \
            > schema_metadata/reports/output-rename.json
          python -m schema_metadata.cli \
            schema_metadata.fixtures:ObjectV1 \
            schema_metadata.fixtures:ObjectV2 \
            --fail-on never --json \
            > schema_metadata/reports/review-required.json
          python -c "import json; p='schema_metadata/reports/input-breaking.json'; d=json.load(open(p)); assert d['verdict'] == 'breaking_detected'"
          python -m pip freeze > schema_metadata/reports/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-migration-research-reports
          path: Tools/experiments/record/schema_metadata/reports/
          if-no-files-found: error
          retention-days: 30
