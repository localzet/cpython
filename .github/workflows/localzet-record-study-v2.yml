name: Record type study v2

on:
  push:
    branches:
      - experimental/record-type-study-v2
    paths:
      - 'Tools/experiments/record/**'
      - '.github/workflows/localzet-record-study-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-study-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned research dependencies
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Compile, test, run example
        run: |
          python -m compileall -q Tools/experiments/record
          cd Tools/experiments/record
          python -m unittest discover -s . -p 'test_*.py' -v
          python example.py

  typing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned static analyzers
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Verify positive and negative type-checker fixtures
        run: python Tools/experiments/record/check_typing.py

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned benchmark dependencies
        run: python -m pip install -r Tools/experiments/record/requirements-research.txt
      - name: Save benchmark results
        run: |
          cd Tools/experiments/record
          python benchmark_matrix.py --sizes 3 10 30 --number 2000 --repeat 5 --instances 1500 --output record-bench-results.json
          python -c "import json; d=json.load(open('record-bench-results.json')); print('Measurements:', len(d['results'])); assert len(d['results']) > 100"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-study-benchmark-py313
          path: Tools/experiments/record/record-bench-results.json
          if-no-files-found: error
          retention-days: 30
