name: Verify sparse dict subclass merge (fork only)

on:
  push:
    branches:
      - verify/gh-161524-dict-subclass-merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug regression test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          ./configure --with-pydebug --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict test_capi.test_watchers

  free-threaded:
    name: Free-threaded regression test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          ./configure --with-pydebug --disable-gil --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict test_capi.test_watchers
