name: Sparse dict research (fork only)

on:
  push:
    branches:
      - research/gh-161524-sparse-dict-copy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparse-dict-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug GIL correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test debug interpreter
        run: |
          ./configure --with-pydebug --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict
          ./python Tools/scripts/stress_sparse_dict_copy.py

  free-threaded:
    name: Debug free-threaded correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test free-threaded interpreter
        run: |
          ./configure --with-pydebug --disable-gil --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict
          ./python Tools/scripts/stress_sparse_dict_copy.py

  benchmark:
    name: Non-debug benchmark against baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          persist-credentials: false
      - name: Build and benchmark candidate
        run: |
          ./configure --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict
          ./python Tools/scripts/stress_sparse_dict_copy.py
          echo '=== CANDIDATE ==='
          ./python Tools/scripts/bench_sparse_dict_copy.py
      - name: Build and benchmark baseline
        run: |
          git worktree add --detach ../baseline 3c92a06e0d08f482f1e368a41670404ef5d247da
          cd ../baseline
          ./configure --without-ensurepip
          make -j4
          echo '=== BASELINE ==='
          ./python ../cpython/Tools/scripts/bench_sparse_dict_copy.py
