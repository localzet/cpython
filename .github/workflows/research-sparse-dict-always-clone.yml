name: Sparse dict always-clone comparison (fork only)

on:
  push:
    branches:
      - research/gh-161524-always-clone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normal:
    name: Always true vs 1/64 (regular build)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
          persist-credentials: false
      - name: Build always-clone candidate
        run: |
          ./configure --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict test_capi.test_watchers
          ./python Tools/scripts/stress_sparse_dict_copy.py
      - name: Build threshold reference
        run: |
          git worktree add --detach ../reference 4184ed375985bc9f835dde526bc5cd95c0ee044f
          (cd ../reference && ./configure --without-ensurepip && make -j4)
      - name: ABBA benchmark
        run: |
          echo '=== CANDIDATE 1 ==='
          ./python Tools/scripts/bench_sparse_dict_always_clone.py
          echo '=== REFERENCE 1 ==='
          (cd ../reference && ./python ../cpython/Tools/scripts/bench_sparse_dict_always_clone.py)
          echo '=== REFERENCE 2 ==='
          (cd ../reference && ./python ../cpython/Tools/scripts/bench_sparse_dict_always_clone.py)
          echo '=== CANDIDATE 2 ==='
          ./python Tools/scripts/bench_sparse_dict_always_clone.py

  pgo:
    name: Always true vs 1/64 (GCC PGO/LTO)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
          persist-credentials: false
      - name: Build always-clone candidate
        run: |
          ./configure --enable-optimizations --with-lto --without-ensurepip
          make -j4
          ./python -m test -j2 test_dict test_capi.test_dict test_capi.test_watchers
      - name: Build threshold reference
        run: |
          git worktree add --detach ../reference 4184ed375985bc9f835dde526bc5cd95c0ee044f
          (cd ../reference && ./configure --enable-optimizations --with-lto --without-ensurepip && make -j4)
      - name: ABBA benchmark
        run: |
          echo '=== CANDIDATE 1 ==='
          ./python Tools/scripts/bench_sparse_dict_always_clone.py
          echo '=== REFERENCE 1 ==='
          (cd ../reference && ./python ../cpython/Tools/scripts/bench_sparse_dict_always_clone.py)
          echo '=== REFERENCE 2 ==='
          (cd ../reference && ./python ../cpython/Tools/scripts/bench_sparse_dict_always_clone.py)
          echo '=== CANDIDATE 2 ==='
          ./python Tools/scripts/bench_sparse_dict_always_clone.py
